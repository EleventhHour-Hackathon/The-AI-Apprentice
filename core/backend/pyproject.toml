[project]
name = "Hexagon-AI"
version = "0.1.0"
description = "Ai Interviewer for Hexagon-A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp[speedups]>=3.9.3",
    "fastapi[standard]>=0.115.8",
    "google-generativeai>=0.8.4",
    "openai>=1.59",
    "pipecat-ai[silero,daily,elevenlabs,google,deepgram,openai,anthropic,websocket,cartesia,groq,aws]>=0.0.82",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "loguru>=0.7.3",
    "supabase>=1.0.3",
    "pipecat-ai-flows>=0.0.18",
    "PyPDF2>=3.0.1",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.5.0"
]
# Name redaction (src/services/privacy.py): `uv sync --extra privacy`.
# The caps keep the default install as it is: presidio-analyzer 2.2.363+ needs pydantic>=2.12.5,
# spaCy 3.8.15+ needs a newer click, and later Presidio releases skip spaCy 3.8.14.
privacy = [
    "presidio-analyzer>=2.2,<2.2.363",
    "spacy>=3.8,<3.8.14",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "ARG", "SIM"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"src/services/bot_defaults.py" = ["F401"]
