# GitHub Pages for the PUBLIC repo GsnMithra/tacit-app.
#
# Setup in the public repo:
#   1. Copy everything in website/ except deploy/ to the repo root (index.html, install.html,
#      styles.css, main.js, favicon.svg).
#   2. Copy this file to .github/workflows/pages.yml.
#   3. Settings > Pages > Build and deployment > Source: GitHub Actions.
# The site is plain HTML/CSS/JS with relative links, so there is no build step and it works
# under https://gsnmithra.github.io/tacit-app/.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir -p _site
          cp -- *.html *.css *.js *.svg _site/
          # Optional extra files, if added later.
          for f in robots.txt CNAME; do [ -f "$f" ] && cp -- "$f" _site/ || true; done
          for d in assets images; do [ -d "$d" ] && cp -R -- "$d" _site/ || true; done
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
