# Render Blueprint for the hosted Tacit backend. Steps: docs/DEPLOY.md.
# Every API key lives here, on the server; the desktop app only knows the URL and the access key.
services:
  - type: web
    name: tacit-backend
    runtime: docker
    rootDir: core/backend
    # Render resolves these relative to rootDir (core/backend).
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # free: sleeps after 15 idle minutes, so the first call after a break waits about a minute.
    # For an always-on server pick a paid plan (0.5c-512mb or larger) in the dashboard.
    plan: free
    healthCheckPath: /health
    envVars:
      # The desktop app sends this in the X-Tacit-Key header. Render generates it once.
      - key: TACIT_ACCESS_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Postgres for Work Maps, sessions, lessons (Supabase connection string).
      - key: SUPABASE_DB_URL
        sync: false
      # Supabase Storage for recordings and clips; without it they stay on the server's disk,
      # which Render wipes on every deploy and restart.
      - key: SUPABASE_SECRET_KEY
        sync: false
